name: Hymns browser lifecycle

on:
  pull_request:
    branches: [codex/complete-hymns]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          path: Api
      - uses: actions/checkout@v4
        with:
          repository: Nyxar-code/B1Admin
          ref: 119d61e5a4bdfaaad6a246aa5070acfe91043304
          path: B1Admin
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyxar-code/B1App
          ref: 5e94e828942c5e0dbdea4728237b69f5174d1ade
          path: B1App
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install API and frontend dependencies
        run: |
          corepack enable
          for project in Api B1Admin B1App; do
            (cd "$project" && yarn install --immutable)
          done
      - name: Migrate and seed the disposable database
        working-directory: Api
        run: |
          sed 's/root:password@localhost/root:local-ci-only@127.0.0.1/g' .env.sample > .env
          cat >> .env <<'LOCAL'
          GOCURRICULUM_CLIENT_SECRET=ci-placeholder
          GOCURRICULUM_FEEDS={}
          GOOGLE_DRIVE_CLIENT_SECRET=ci-placeholder
          ONEDRIVE_CLIENT_SECRET=ci-placeholder
          LOCAL
          yarn initdb
      - name: Install Chromium
        working-directory: B1Admin
        run: yarn exec playwright install --with-deps chromium
      - name: Start the isolated apps
        run: |
          echo '127.0.0.1 grace.localtest.me' | sudo tee -a /etc/hosts
          (cd Api && yarn exec tsx src/index.ts) > "$RUNNER_TEMP/hymns-api.log" 2>&1 &
          (cd B1Admin && PORT=3101 REACT_APP_STAGE=dev REACT_APP_API_BASE=http://localhost:8084 yarn start) > "$RUNNER_TEMP/hymns-admin.log" 2>&1 &
          (cd B1App && NEXT_PUBLIC_STAGE=dev NEXT_PUBLIC_API_BASE=http://localhost:8084 yarn exec next dev --webpack -p 3301) > "$RUNNER_TEMP/hymns-web.log" 2>&1 &
          for url in http://localhost:8084/health http://localhost:3101/; do
            curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 "$url" > /dev/null
          done
          for attempt in $(seq 1 60); do
            if timeout 1 bash -c '>/dev/tcp/127.0.0.1/3301' 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify draft, publish, web, mobile, and archive
        working-directory: B1Admin
        run: |
          cp ../Api/tools/verify-hymns-browser.mjs ./verify-hymns-browser.mjs
          node verify-hymns-browser.mjs
      - name: Print application logs on failure
        if: failure()
        run: |
          for app in api admin web; do
            if test -f "$RUNNER_TEMP/hymns-$app.log"; then
              printf '\n--- %s ---\n' "$app"
              tail -n 65 "$RUNNER_TEMP/hymns-$app.log"
            fi
          done
